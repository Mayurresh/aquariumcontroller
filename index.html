<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarium Controller (Global Cloud)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.8);
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 25px;
            background-color: #2d2d2d;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .device-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .badge-online { background-color: #1e4620; color: #28a745; border: 1px solid #28a745; }
        .badge-offline { background-color: #4a191b; color: #dc3545; border: 1px solid #dc3545; }

        .time-display {
            font-size: 2.5em;
            color: #79c0ff;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .status-section p {
            font-size: 1.1em;
            margin: 12px 0;
            color: #c9d1d9;
        }
        .button-group {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .button {
            padding: 12px 25px;
            font-size: 1em;
            cursor: pointer;
            color: #ffffff;
            background-color: #0d6efd;
            border: none;
            border-radius: 6px;
            transition: background-color 0.2s, opacity 0.2s;
        }
        .button:hover:not(:disabled) { background-color: #0a58ca; }
        .button:disabled { opacity: 0.4; cursor: not-allowed; }
        .button-green { background-color: #198754; }
        .button-green:hover:not(:disabled) { background-color: #157347; }

        .control-group {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #444;
        }
        .control-group input[type="number"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #333;
            color: #e0e0e0;
            width: 80px;
            margin-right: 10px;
        }
        .status-on { color: #28a745; font-weight: bold; }
        .status-off { color: #dc3545; font-weight: bold; }
        .status-offline { color: #ffc107; font-weight: bold; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <h1>Aquarium Controller</h1>
    <div class="container">
        <div id="device-status-badge" class="device-badge badge-offline">ESP32 OFFLINE</div>
        <div id="live-clock" class="time-display">--:--:--</div>
        
        <div class="status-section">
            <p><strong>Light Status:</strong> <span id="light-status">OFFLINE</span></p>
            <p><strong>Fan Status:</strong> <span id="fan-status">OFFLINE</span></p>
            <p><strong>Last Feed:</strong> <span id="last-feed">--</span></p>
        </div>

        <div class="button-group">
            <button id="btn-light" class="button" onclick="toggleLight()" disabled>Toggle Light</button>
            <button id="btn-fan" class="button button-green" onclick="toggleFan()" disabled>Toggle Fan</button>
            <button id="btn-feed" class="button" onclick="feedFish()" disabled>Feed Fish Now</button>
        </div>

        <div class="control-group">
            <label for="feedtimer_val">Time Delay for feeding (ms):</label>
            <input type="number" id="feedtimer_val" min="100" max="4000" value="1500">
            <button id="btn-timer" class="button" onclick="setFeedTimer()" disabled>Set Timer</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_WEB_API_KEY",
            authDomain: "aquariumfeeder-9777a.firebaseapp.com",
            databaseURL: "https://aquariumfeeder-9777a-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "aquariumfeeder-9777a",
            storageBucket: "aquariumfeeder-9777a.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentLightState = false;
        let currentFanState = false;
        let lastSeenTimestamp = 0;
        let isDeviceOnline = false;

        // Monitor Device Heartbeat and Status
        db.ref('/status').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                currentLightState = data.light || false;
                currentFanState = data.fan || false;
                document.getElementById('last-feed').textContent = data.lastFeed || 'N/A';

                if (data.lastSeen) {
                    lastSeenTimestamp = data.lastSeen;
                }
            }
        });

        db.ref('/settings/feedtimer').on('value', (s) => {
            if (s.exists()) document.getElementById('feedtimer_val').value = s.val();
        });

        // Presence Check Loop (Runs locally every 3 seconds)
        function checkPresence() {
            const nowEpoch = Math.floor(Date.now() / 1000);
            // If the heartbeat is older than 12 seconds, treat device as OFFLINE
            if (lastSeenTimestamp > 0 && (nowEpoch - lastSeenTimestamp) <= 12) {
                isDeviceOnline = true;
                document.getElementById('device-status-badge').textContent = 'ESP32 ONLINE';
                document.getElementById('device-status-badge').className = 'device-badge badge-online';

                // Enable action buttons
                document.getElementById('btn-light').disabled = false;
                document.getElementById('btn-fan').disabled = false;
                document.getElementById('btn-feed').disabled = false;
                document.getElementById('btn-timer').disabled = false;

                // Update Relay Displays
                document.getElementById('light-status').textContent = currentLightState ? 'ON' : 'OFF';
                document.getElementById('light-status').className = currentLightState ? 'status-on' : 'status-off';

                document.getElementById('fan-status').textContent = currentFanState ? 'ON' : 'OFF';
                document.getElementById('fan-status').className = currentFanState ? 'status-on' : 'status-off';
            } else {
                isDeviceOnline = false;
                document.getElementById('device-status-badge').textContent = 'ESP32 OFFLINE';
                document.getElementById('device-status-badge').className = 'device-badge badge-offline';

                // Disable action buttons when board is dead/unplugged
                document.getElementById('btn-light').disabled = true;
                document.getElementById('btn-fan').disabled = true;
                document.getElementById('btn-feed').disabled = true;
                document.getElementById('btn-timer').disabled = true;

                // Display OFFLINE text
                document.getElementById('light-status').textContent = 'OFFLINE';
                document.getElementById('light-status').className = 'status-offline';

                document.getElementById('fan-status').textContent = 'OFFLINE';
                document.getElementById('fan-status').className = 'status-offline';
            }
        }

        setInterval(checkPresence, 3000);

        // Control Actions
        function toggleLight() {
            if (!isDeviceOnline) return;
            currentLightState = !currentLightState;
            db.ref('/controls/light').set(currentLightState);
        }

        function toggleFan() {
            if (!isDeviceOnline) return;
            currentFanState = !currentFanState;
            db.ref('/controls/fan').set(currentFanState);
        }

        function feedFish() {
            if (!isDeviceOnline) return;
            document.getElementById('last-feed').textContent = 'Feeding started...';
            db.ref('/triggers/feedNow').set(true);
        }

        function setFeedTimer() {
            if (!isDeviceOnline) return;
            const val = parseInt(document.getElementById('feedtimer_val').value);
            db.ref('/settings/feedtimer').set(val);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').textContent = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
